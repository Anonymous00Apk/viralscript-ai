[build]
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[functions."gerar-roteiro"]
timeout = 26

[[redirects]]
from = "/api/gerar"
to = "/.netlify/functions/gerar-roteiro"
status = 200

# HTML: sempre validado (mudanças aparecem na hora)
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# CSS compartilhado: 7 dias (raramente muda; revalidado por ETag)
[[headers]]
for = "/estilo.css"
[headers.values]
Cache-Control = "public, max-age=604800, must-revalidate"

# config.js: cache curto — você edita esse arquivo (link do café, IDs AdSense)
# e o visitante precisa ver a mudança em minutos, não horas
[[headers]]
for = "/config.js"
[headers.values]
Cache-Control = "public, max-age=300, must-revalidate"

# API: respostas dinâmicas — nunca cachear
[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-store"

# Segurança em todas as rotas
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"